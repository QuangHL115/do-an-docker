<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cổng Thông Tin - Đề 19</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">📰 VN-NEWS PORTAL</a>
        <button class="btn btn-warning btn-sm fw-bold" data-bs-toggle="modal" data-bs-target="#adminModal">+ Đăng Bài</button>
    </div>
</nav>
<div class="container">
    <div class="row">
        {% for item in articles %}
        <div class="col-md-6 mb-4">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5 class="fw-bold">{{ item.title }}</h5>
                    <p class="text-muted">{{ item.summary }}</p>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
<!-- Modal Admin -->
<div class="modal fade" id="adminModal">
    <div class="modal-dialog">
        <form action="/admin/create" method="post" class="modal-content">
            <div class="modal-header bg-dark text-white"><h5 class="modal-title">Đăng Bài</h5></div>
            <div class="modal-body">
                <input type="text" name="title" class="form-control mb-2" placeholder="Tiêu đề" required>
                <select name="category_id" class="form-select mb-2">
                    {% for cat in categories %}<option value="{{ cat.id }}">{{ cat.name }}</option>{% endfor %}
                </select>
                <input type="password" name="token" class="form-control mb-2" placeholder="Mã Admin (admin123)" required>
                <textarea name="summary" class="form-control mb-2" placeholder="Tóm tắt" required></textarea>
                <textarea name="content" class="form-control" placeholder="Nội dung" required></textarea>
            </div>
            <div class="modal-footer"><button type="submit" class="btn btn-primary">Xuất bản</button></div>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
